<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- SEO -->
  <title>Blog WC26 Travel — Guides Coupe du Monde 2026</title>
  <meta name="description" content="Guides complets Coupe du Monde 2026 : billets, voyage USA, hôtels, stades et budget.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://usawc26.com/blog/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog WC26 Travel">
  <meta property="og:description" content="Guides et conseils Coupe du Monde 2026">
  <meta property="og:url" content="https://usawc26.com/blog/">

  <!-- Google tag (safe init) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TVSL5DL75X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TVSL5DL75X');

    function trackEvent(name, params = {}) {
      if (typeof gtag !== "undefined") {
        gtag('event', name, params);
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;background:#0b0f1a;color:#fff}
    .blog-card{border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
    .blog-card img{width:100%;height:100%;object-fit:cover}
    .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px}
    .badge-red{background:rgba(255,0,0,.2);color:#ff4d4d}
    .badge-blue{background:rgba(0,120,255,.2);color:#4da3ff}
    .badge-gold{background:rgba(255,200,0,.2);color:#ffd34d}
    .hidden{display:none!important}
    .cat-btn{cursor:pointer;padding:6px 12px;border-radius:20px;border:1px solid #333}
    .cat-btn.active{background:#ff0033;color:#fff}
  </style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="/">Home</a>
  <a href="/blog/" class="active">Blog</a>
</nav>

<!-- HERO -->
<section style="text-align:center;padding:80px 20px">
  <h1>Blog WC26 Travel</h1>
  <p>Guides Coupe du Monde 2026</p>
</section>

<!-- FILTERS -->
<div style="text-align:center;margin-bottom:30px">
  <button class="cat-btn active" onclick="filterCat(this,'all')">Tous</button>
  <button class="cat-btn" onclick="filterCat(this,'Billets')">Billets</button>
  <button class="cat-btn" onclick="filterCat(this,'Guide Voyage')">Voyage</button>
  <button class="cat-btn" onclick="filterCat(this,'Hôtels')">Hôtels</button>
  <button class="cat-btn" onclick="filterCat(this,'Stades')">Stades</button>
  <button class="cat-btn" onclick="filterCat(this,'Budget')">Budget</button>
</div>

<!-- BLOG GRID -->
<div id="blogGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px">

  <article class="blog-card" data-cat="Billets">
    <img src="https://images.unsplash.com/photo-1560272564-c83b66b1ad12?w=600">
    <div style="padding:15px">
      <span class="badge badge-red">Billets</span>
      <h3>Guide Billets FIFA 2026</h3>
    </div>
  </article>

  <article class="blog-card" data-cat="Guide Voyage">
    <img src="https://images.unsplash.com/photo-1485871981521-5b1fd3805eee?w=600">
    <div style="padding:15px">
      <span class="badge badge-blue">Voyage</span>
      <h3>Visa & Voyage USA 2026</h3>
    </div>
  </article>

  <article class="blog-card" data-cat="Hôtels">
    <img src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=600">
    <div style="padding:15px">
      <span class="badge badge-gold">Hôtels</span>
      <h3>Meilleurs hôtels stades</h3>
    </div>
  </article>

</div>

<!-- JS FIXED -->
<script>
function filterCat(btn, cat){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  document.querySelectorAll('.blog-card').forEach(card=>{
    const c = card.getAttribute('data-cat');
    if(cat === 'all' || c === cat){
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });

  trackEvent('filter_click', {category: cat});
}
</script>

</body>
</html>
